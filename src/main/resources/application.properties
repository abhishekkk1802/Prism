spring.application.name=gateway

# Overridable so the same image/jar works unchanged in docker-compose
# (where Postgres/Redis are reached by service name, not localhost).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:task_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:task_app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.flyway.schemas=prism
spring.flyway.default-schema=prism
spring.flyway.create-schemas=true

spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Semantic-cache embeddings via OpenRouter (OpenAI-compatible, 1536-dim).
# Base URL is pinned to OpenRouter: embeddings 
prism.cache.embedding.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
prism.cache.embedding.api-key=${OPENROUTER_API_KEY:${OPENAI_API_KEY:placeholder}}
prism.cache.embedding.model=${EMBEDDING_MODEL:openai/text-embedding-3-small}
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration


spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Actuator health groups (plan section 8): /health is a plain liveness check
# served by HealthController; /actuator/health/readiness reports whether
# PostgreSQL and Redis are actually reachable.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# Admin API token (plan section 1/8): separate credential from team API keys,
# required on every /admin/* request as "Authorization: Bearer <token>".
# Override in production via the PRISM_ADMIN_TOKEN env var.
prism.admin.token=${PRISM_ADMIN_TOKEN:prism-admin-dev-token}

# Optional external gateway-config.json override (used by docker-compose to
# point providers at Compose service names). Empty = use the bundled classpath
# resource unchanged.
prism.gateway-config.path=${PRISM_GATEWAY_CONFIG_PATH:}

# CORS allow-list for the admin console (/admin/** only). Comma-separated.
prism.admin.cors.allowed-origins=${PRISM_ADMIN_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5555}